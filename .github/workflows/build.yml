name: ADBCore Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests
        run: swift test
      - name: Run iOS simulator tests
        run: xcodebuild test -scheme ADBCore -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' CODE_SIGNING_ALLOWED=NO
      - name: Build for iOS
        run: xcodebuild -scheme ADBCore -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
