name: Pull Request Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode project
        uses: ./.github/actions/setup-xcode

      - name: Select simulator
        id: simulator
        run: |
          DESTINATION=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              device
              for runtime, runtime_devices in devices.items()
              if "iOS" in runtime
              for device in runtime_devices
              if device.get("isAvailable") and "iPhone" in device["name"]
          ]
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          print("platform=iOS Simulator,id=" + candidates[-1]["udid"])
          ')
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project iADB.xcodeproj \
            -scheme iADB \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -resultBundlePath build/TestResults.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            2>&1 | tee build/test.log

      - name: Generic device Release build
        run: |
          set -o pipefail
          xcodebuild build \
            -project iADB.xcodeproj \
            -scheme iADB \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/release-build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/*.log
            build/TestResults.xcresult
          retention-days: 14
