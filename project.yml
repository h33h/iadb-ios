name: iADB
options:
  bundleIdPrefix: com.iadb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  projectFormatVersion: "56"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    exactVersion: "1.25.5"
  swift-case-paths:
    url: https://github.com/pointfreeco/swift-case-paths
    exactVersion: "1.7.3"
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    exactVersion: "1.12.0"
  swift-concurrency-extras:
    url: https://github.com/pointfreeco/swift-concurrency-extras
    exactVersion: "1.3.2"
  swift-perception:
    url: https://github.com/pointfreeco/swift-perception
    exactVersion: "1.6.0"
  xctest-dynamic-overlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    exactVersion: "1.9.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  iADB:
    type: application
    platform: iOS
    sources:
      - path: iADB
        excludes:
          - "Assets.xcassets"
          - "PrivacyInfo.xcprivacy"
          - "Resources"
          - "**/*.xcassets/**/.*"
      - path: iADB/Assets.xcassets
        buildPhase: resources
      - path: iADB/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: iADB/Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: iADB/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.iadb.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - package: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
      - package: swift-concurrency-extras
        product: ConcurrencyExtras
      - package: swift-perception
        product: Perception
      - package: swift-perception
        product: PerceptionCore
      - package: xctest-dynamic-overlay
        product: XCTestDynamicOverlay
      - package: xctest-dynamic-overlay
        product: IssueReporting

  iADBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iADBTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iadb.tests
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: iADB
      - package: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
      - package: swift-concurrency-extras
        product: ConcurrencyExtras
      - package: swift-perception
        product: Perception
      - package: swift-perception
        product: PerceptionCore
      - package: xctest-dynamic-overlay
        product: XCTestDynamicOverlay
      - package: xctest-dynamic-overlay
        product: IssueReporting

  iADBUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iADBUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iadb.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: iADB
    dependencies:
      - target: iADB

schemes:
  iADB:
    build:
      targets:
        iADB: all
        iADBTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iADBTests
        - iADBUITests
    archive:
      config: Release
  iADB Android Emulator:
    build:
      targets:
        iADB: all
        iADBTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "--iadb-debug-android-emulator": true
      environmentVariables:
        IADB_DEBUG_ANDROID_HOST: "127.0.0.1"
        IADB_DEBUG_ANDROID_PORT: "5555"
    test:
      config: Debug
      targets:
        - iADBTests
